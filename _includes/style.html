<style>
  /* ── デザイン基調は JST CRONOS のサイトに合わせている（明朝＋青の editorial 系） ── */
  :root {
    --serif: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", "游明朝",
             "Songti SC", "Noto Serif JP", "Noto Serif SC", serif;
    --ink: #222b36;
    --blue: #4385f5;
    --muted: #3f4c5a;
    --faint: #67717d;
    --line: #e1e6ea;
    --rule: #d5dde6;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 102px; }
  body {
    margin: 0; background: #fff; color: var(--ink);
    font-family: var(--serif);
    font-size: 16px; line-height: 1.9;
    letter-spacing: 0.02em;
    overflow-x: hidden; overflow-x: clip;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  img { max-width: 100%; height: auto; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 clamp(1.1rem, 4vw, 2.6rem); }

  /* ── ヘッダー ── */
  .masthead {
    position: sticky; top: 0; z-index: 1000;
    background: rgba(255,255,255,0.97);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .masthead .wrap {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1.2em; min-height: 66px; flex-wrap: wrap;
  }
  .brand {
    font-weight: 600; font-size: clamp(1rem, 1.6vw, 1.1rem);
    letter-spacing: 0.1em; color: var(--ink); white-space: nowrap;
  }
  .brand:hover { text-decoration: none; opacity: 0.7; }
  /* 左上・ヒーローとも、和名と英名はどちらも本文色（薄くしない） */
  .brand-alt { font-size: 0.82em; letter-spacing: 0.06em; color: var(--ink); font-weight: 400; }
  .navbar { display: flex; align-items: center; gap: clamp(0.9em, 2.2vw, 1.8em); flex-wrap: wrap; }
  .navbar a { color: var(--muted); font-size: 0.9em; letter-spacing: 0.08em; white-space: nowrap; }
  .navbar a:hover, .navbar a.is-active { color: var(--blue); text-decoration: none; }

  /* 言語切替 */
  .lang { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
  .lang a {
    font-size: 0.72em; letter-spacing: 0.06em; padding: 0.25em 0.8em;
    color: var(--muted); background: #fff; white-space: nowrap;
  }
  .lang a + a { border-left: 1px solid var(--rule); }
  .lang a:hover { color: var(--blue); text-decoration: none; }
  .lang a.is-active { background: var(--blue); color: #fff; }

  /* ── セクション見出し（CRONOS と同じ体裁） ── */
  .sechead { display: flex; align-items: baseline; gap: 1.1em; margin: 3.0em 0 1.0em; }
  .sechead:first-child { margin-top: 0; }
  .sechead h2 {
    margin: 0; padding: 0.3em 0.2em;
    border-top: 1px solid var(--blue); border-bottom: 1px solid var(--blue);
    font-size: 1.8em; letter-spacing: 0.28em; font-weight: 600; color: var(--blue);
  }
  .sechead .en { font-size: 0.62em; letter-spacing: 0.06em; color: var(--faint); font-weight: 600; }
  section { scroll-margin-top: 102px; }
  /* セクションの間隔。.sechead は各 section の first-child なので
     .sechead:first-child の margin-top:0 が全部に効いてしまう。
     そのため青い罫線の上の余白は section 側に持たせる。
     CV の section は .cv-main の中なので（main の直下ではない）影響しない。 */
  main > section + section { margin-top: 4.4em; }

  /* ── ヒーロー ── */
  .hero { display: flex; gap: clamp(1.5em, 4vw, 3em); align-items: flex-start; padding: clamp(2.4em, 6vw, 4em) 0 1.5em; }
  /* 左は写真とお知らせ、右は本文と概要。概要が写真の隣に並ぶようにしてある */
  .hero-side { flex: 0 0 clamp(150px, 24vw, 250px); }
  .hero-photo { width: 100%; }
  .hero-photo img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 50%; border: 1px solid var(--line); }
  .hero-body { flex: 1 1 auto; min-width: 0; }
  .hero h1 { margin: 0; font-size: clamp(1.9rem, 5vw, 2.9rem); letter-spacing: 0.12em; font-weight: 600; line-height: 1.3; }
  /* 「高橋 亮｜Ryo Takahashi」と1行で出す。狭い幅では折り返す */
  .hero h1 .name-alt {
    font-size: 0.46em; letter-spacing: 0.08em; color: var(--ink); font-weight: 400;
  }
  .hero .role { color: var(--muted); font-size: 0.92em; margin: 0.9em 0 0; }
  .hero .tagline { font-size: clamp(1.05rem, 2.2vw, 1.3rem); color: var(--blue); margin: 1.1em 0 0; letter-spacing: 0.06em; }
  .hero .lead { margin: 0.8em 0 0; }
  .links { display: flex; flex-wrap: wrap; gap: 0.5em; margin-top: 1.4em; }
  .links a {
    font-size: 0.76em; letter-spacing: 0.04em; color: var(--muted);
    border: 1px solid var(--rule); border-radius: 999px; padding: 0.2em 1em;
  }
  .links a:hover { border-color: var(--blue); color: var(--blue); text-decoration: none; }

  /* ── お知らせ（左カラム） ── */
  .hero-news { margin-top: 1.6em; }
  .side-head {
    margin: 0 0 0.7em; font-size: 0.72em; letter-spacing: 0.18em; font-weight: 600;
    color: var(--blue); border-bottom: 1px solid var(--blue); padding-bottom: 0.35em;
  }
  .hero-news ul { list-style: none; margin: 0; padding: 0; }
  .hero-news li { font-size: 0.74em; line-height: 1.6; padding: 0.5em 0; border-bottom: 1px solid var(--line); }
  .hero-news li:last-child { border-bottom: 0; }
  .news-meta {
    display: block; color: var(--faint); font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em; margin-bottom: 0.15em;
  }
  .news-cat {
    margin-left: 0.6em; padding: 0.05em 0.55em; border-radius: 999px;
    background: #eef3fb; color: var(--blue); font-weight: 600; letter-spacing: 0.06em;
  }
  .hero-news a { color: var(--ink); }
  .hero-news a:hover { color: var(--blue); }

  /* 概要はヒーローの右カラムに入るので、上の余白を詰める */
  .hero-body #about { margin-top: 2.2em; }
  .hero-body #about .sechead { margin-top: 0; }

  @media (max-width: 640px) {
    .hero-side { flex: 1 1 auto; width: 100%; }
    .hero-photo { width: clamp(120px, 40vw, 190px); }
  }

  /* ── 研究テーマ（図＋本文＋関連論文のカード） ── */
  .themes {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
    gap: 1.6em; margin-top: 1.6em;
  }
  .theme {
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .theme-fig { background: #f3f5f7; border-bottom: 1px solid var(--line); }
  .theme-fig img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
  .theme h3 {
    margin: 1.2em 1.3em 0.5em; font-size: 1.05em; letter-spacing: 0.08em;
    color: var(--ink); font-weight: 600;
  }
  .theme p { margin: 0 1.3em; font-size: 0.86em; color: var(--ink); line-height: 1.85; }

  /* 関連論文。まずは下端に寄せる（subgrid が使えない環境向けの土台） */
  .theme-pubs { margin: auto 1.3em 1.3em; padding-top: 1em; }

  /* 行を隣のカードと揃える。カードを4行ぶんの subgrid にすると、
     図・見出し・本文・関連論文がそれぞれ同じ高さの行に入る。
     本文の長さが違っても「関連論文」の開始位置が揃う。 */
  @supports (grid-template-rows: subgrid) {
    .theme {
      display: grid; grid-row: span 4; grid-template-rows: subgrid;
    }
    .theme-pubs { margin-top: 0; }
  }
  .theme-pubs-head {
    font-size: 0.68em; letter-spacing: 0.12em; font-weight: 600; color: var(--faint);
    padding-bottom: 0.4em; border-bottom: 1px solid var(--line); margin-bottom: 0.7em;
    font-variant-numeric: tabular-nums;
  }
  .theme-pubs ul { list-style: none; margin: 0; padding: 0; }
  .theme-pubs li { font-size: 0.78em; line-height: 1.65; }
  .theme-pubs li + li { margin-top: 0.6em; }
  .theme-pubs a { color: var(--ink); }
  .theme-pubs a:hover { color: var(--blue); }
  .theme-pub-meta { display: block; color: var(--faint); font-style: italic; font-size: 0.9em; }

  /* ── 一覧（論文・受賞・講演） ── */
  .filter { display: flex; flex-wrap: wrap; gap: 0.5em; margin: 0 0 1.4em; }
  .filter-btn {
    appearance: none; border: 1px solid var(--rule); background: #fff; color: var(--muted);
    font: inherit; font-size: 0.72em; font-weight: 600; line-height: 1.4;
    padding: 0.2em 1em; border-radius: 999px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .filter-btn:hover { border-color: var(--blue); color: var(--blue); }
  .filter-btn.is-active { background: var(--blue); border-color: var(--blue); color: #fff; }

  .year-head, .group-head {
    font-size: 1.15em; font-weight: 600; color: var(--ink);
    border-bottom: 2px solid var(--ink); padding-bottom: 0.3em;
    margin: 1.8em 0 0.7em; font-variant-numeric: tabular-nums;
    letter-spacing: 0.1em;
    display: flex; align-items: baseline; justify-content: space-between; gap: 0.6em;
  }
  .group-count { font-size: 0.62em; color: var(--faint); font-weight: 400; letter-spacing: 0.04em; }
  .entry { display: flex; gap: 1em; padding: 0.85em 0; border-bottom: 1px solid #f0f3f6; }
  .entry-mark { flex: 0 0 auto; width: 5.4em; padding-top: 0.15em; }
  .badge {
    display: inline-block; font-size: 0.62em; letter-spacing: 0.06em; font-weight: 600;
    padding: 0.15em 0.7em; border-radius: 999px; white-space: nowrap;
    background: #eef3fb; color: var(--blue);
  }
  .badge--journal { background: #e8f2ec; color: #1f7a4d; }
  .badge--conference { background: #eef3fb; color: #2f6fd0; }
  .badge--workshop { background: #f3eefb; color: #6b4fc4; }
  .badge--demo, .badge--poster { background: #fdf0e6; color: #c2660f; }
  .badge--domestic { background: #f1f3f5; color: #5b6b7b; }
  .badge--article { background: #fdeef2; color: #b83a5e; }
  .entry-body { flex: 1 1 auto; min-width: 0; }
  .entry-title { font-size: 0.98em; line-height: 1.65; color: var(--ink); }
  .entry-title a { color: var(--ink); }
  .entry-title a:hover { color: var(--blue); }
  .entry-authors { font-size: 0.8em; color: var(--muted); margin-top: 0.25em; line-height: 1.7; }
  .entry-venue { font-size: 0.8em; color: var(--faint); font-style: italic; margin-top: 0.15em; }
  .entry-award { font-size: 0.72em; color: #b8860b; margin-top: 0.25em; letter-spacing: 0.04em; }
  .entry-award::before { content: "\1F3C6\FE0E"; margin-right: 0.35em; font-style: normal; }
  .me { color: var(--ink); text-decoration: underline; text-underline-offset: 0.22em;
        text-decoration-thickness: 1px; text-decoration-color: var(--rule); }
  .entry[hidden], .year-head[hidden], .group-head[hidden] { display: none !important; }

  .more { margin: 1.4em 0 0; font-size: 0.86em; }
  .more a { color: var(--ink); }
  .more a:hover { color: var(--blue); }

  /* ── 論文1件の体裁（takuyasasatani.com の Publications に倣う） ──
     .entry は受賞・学歴・研究費の一覧とも共有しているので、
     論文だけの見た目はすべて .entry--pub に閉じ込める。 */
  .entry--pub .entry-title { font-weight: 600; }
  .entry--pub .entry-authors { margin-top: 0.3em; }

  /* 種別ごとに 1 から振り直す。counter-reset は「その要素と後続の兄弟」に
     効くので、種別の見出しに置けばその種別のあいだだけ数が続く。
     #pub-groups 側に置くと種別をまたいだ通し番号になるが、そのときは
     途中の兄弟で同じ名前を counter-reset しても振り直されない（実機で確認済み）。
     総数は見出しの脇に出している（Publications 62）。
     絞り込みで display:none になった行は数えられないので、番号は自動で詰まる。 */
  #pub-groups .group-head { counter-reset: pub; }
  #pub-groups .entry--pub { counter-increment: pub; }
  #pub-groups .entry--pub::before {
    content: counter(pub) ".";
    flex: 0 0 2.1em; text-align: right; padding-top: 0.2em;
    font-size: 0.86em; color: var(--faint); font-variant-numeric: tabular-nums;
  }

  /* リンク（DOI / ACM / IEEE …）。ラベルは pub_entry.html がホストから決める */
  .entry-links { display: flex; flex-wrap: wrap; gap: 0.4em; margin-top: 0.55em; }
  .pill {
    font-size: 0.66em; letter-spacing: 0.05em; font-weight: 600;
    padding: 0.2em 0.85em; border-radius: 999px;
    background: #eef3fb; color: var(--blue);
  }
  .pill:hover { background: var(--blue); color: #fff; text-decoration: none; }

  /* ── CV の2カラム（左に sticky な目次） ── */
  .cv-layout {
    display: grid; grid-template-columns: 190px minmax(0, 1fr);
    gap: clamp(1.4em, 3vw, 2.8em); align-items: start;
  }
  .cv-toc {
    position: sticky; top: 100px;
    background: #f7f9fb; border: 1px solid var(--line); border-radius: 8px;
    padding: 1em 1.1em; max-height: calc(100vh - 140px); overflow-y: auto;
  }
  .cv-toc-head {
    font-size: 0.62em; letter-spacing: 0.16em; font-weight: 600;
    color: var(--faint); margin-bottom: 0.7em;
  }
  .cv-toc ul { list-style: none; margin: 0; padding: 0; }
  .cv-toc a { display: block; font-size: 0.76em; line-height: 1.45; color: var(--muted); padding: 0.22em 0; }
  .cv-toc a:hover { color: var(--blue); text-decoration: none; }
  .cv-toc a.is-current { color: var(--blue); font-weight: 600; }
  .cv-toc ul ul { margin: 0.2em 0 0.4em 0.2em; border-left: 1px solid var(--rule); padding-left: 0.7em; }
  .cv-toc ul ul a { font-size: 0.71em; color: var(--faint); }

  @media (max-width: 860px) {
    .cv-layout { grid-template-columns: 1fr; }
    .cv-toc { position: static; max-height: none; margin-bottom: 1.6em; }
  }

  /* ── CV は項目数が多いので行間を詰める（トップ側は変えない） ── */
  .cv-main .entry { padding: 0.55em 0; }
  .cv-main .entry-title { line-height: 1.5; }
  .cv-main .entry-authors { margin-top: 0.2em; line-height: 1.55; }
  .cv-main .entry-venue { margin-top: 0.1em; }
  .cv-main .entry-links { margin-top: 0.4em; }
  .cv-main .entry-meta { margin-top: 0.25em; }
  .cv-main .cv-head { margin: 1.8em 0 0.5em; }
  .cv-main .group-head { margin: 1.4em 0 0.5em; }
  .cv-main section:first-child .cv-head { margin-top: 0.6em; }

  /* ── CV は項目ごとに 1 から番号を振る（論文は種別をまたぐ通し番号） ── */
  .cv-main .cv-list,
  .cv-main .award-list,
  .cv-main .talk-list { counter-reset: item; }
  .cv-main .cv-list > .entry,
  .cv-main .award-list > .entry,
  .cv-main .talk-list > .entry { counter-increment: item; }
  .cv-main .cv-list > .entry::before,
  .cv-main .award-list > .entry::before,
  .cv-main .talk-list > .entry::before {
    content: counter(item) ".";
    flex: 0 0 2.1em; text-align: right; padding-top: 0.2em;
    font-size: 0.86em; color: var(--faint); font-variant-numeric: tabular-nums;
  }
  /* 縦積みになる幅では番号が1行を占めてしまうので、日付・タイトルと同じ行に置く */
  @media (max-width: 640px) {
    .cv-main .cv-list > .entry::before,
    .cv-main .award-list > .entry::before,
    .cv-main .talk-list > .entry::before,
    #pub-groups .entry--pub::before { flex-basis: auto; text-align: left; padding-top: 0; }
  }

  /* 著者マーカーの凡例（* 筆頭 / † 責任著者）。マーカー自体は authors 列に入っている */
  .author-note {
    margin: 0 0 0.9em; font-size: 0.74em; color: var(--faint); letter-spacing: 0.06em;
  }

  /* ── 研究テーマの詳細ページ ── */
  .research-page { max-width: 820px; }
  .research-fig { margin: 0 0 1.6em; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f3f5f7; }
  .research-fig img { display: block; width: 100%; aspect-ratio: 16 / 8; object-fit: cover; }
  .research-lead { margin: 0; font-size: 0.98em; line-height: 1.95; }
  .research-page .cv-head { margin: 2.4em 0 0.5em; }
  .research-page .entry { padding: 0.55em 0; }
  .research-page .entry-title { line-height: 1.5; }
  .research-page .entry-authors { margin-top: 0.2em; line-height: 1.55; }
  .research-page .author-note {
    margin: 0 0 0.9em; font-size: 0.74em; color: var(--faint); letter-spacing: 0.06em;
  }
  .research-pubs { counter-reset: pub; }
  .research-pubs .entry--pub { counter-increment: pub; }
  .research-pubs .entry--pub::before {
    content: counter(pub) ".";
    flex: 0 0 2.1em; text-align: right; padding-top: 0.2em;
    font-size: 0.86em; color: var(--faint); font-variant-numeric: tabular-nums;
  }

  /* カードのタイトルと画像は詳細ページへのリンク */
  .theme h3 a { color: var(--ink); }
  .theme h3 a:hover { color: var(--blue); text-decoration: none; }
  a.theme-fig { display: block; }
  a.theme-fig img { transition: opacity .15s; }
  a.theme-fig:hover img { opacity: 0.86; }

  /* CV の PDF リンク */
  .cv-pdf { margin: -0.6em 0 1.4em; }
  .cv-pdf a {
    display: inline-block; font-size: 0.72em; letter-spacing: 0.08em; font-weight: 600;
    padding: 0.25em 1.1em; border-radius: 999px; background: #eef3fb; color: var(--blue);
  }
  .cv-pdf a:hover { background: var(--blue); color: #fff; text-decoration: none; }

  /* ── 連絡先 ── */
  .contact p { margin: 0.4em 0; }
  .contact .mail { font-size: 1.05em; letter-spacing: 0.04em; }

  /* ── フッター ── */
  footer.site {
    margin-top: 4em; border-top: 1px solid var(--line);
    padding: 2em 0 3em; font-size: 0.78em; color: var(--faint);
  }
  footer.site .wrap { display: flex; justify-content: space-between; gap: 1em; flex-wrap: wrap; }


  /* ── CV ── */
  .cv-head {
    font-size: 1.05em; letter-spacing: 0.16em; font-weight: 600; color: var(--ink);
    margin: 2.2em 0 0.6em; padding-bottom: 0.25em; border-bottom: 1px solid var(--rule);
    display: flex; align-items: baseline; justify-content: space-between; gap: 0.6em;
  }
  .cv-when {
    font-size: 0.72em; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
  }
  .cv-list .entry-mark { width: 8.6em; }
  .entry-meta { margin-top: 0.35em; display: flex; flex-wrap: wrap; gap: 0.4em; }
  .entry-meta .tag {
    font-size: 0.68em; letter-spacing: 0.04em; color: var(--muted);
    border: 1px solid var(--rule); border-radius: 999px; padding: 0.1em 0.7em;
  }
  .badge--media { background: #eef7f1; color: #2f7d4f; }
  @media (max-width: 640px) { .cv-list .entry-mark { width: auto; } }

  @media (max-width: 640px) {
    /* .research-pubs の基本規則はこの上にあるので、ここで上書きする */
    .research-pubs .entry--pub::before { flex-basis: auto; text-align: left; padding-top: 0; }
    body { font-size: 15px; }
    .hero { flex-direction: column; align-items: flex-start; text-align: left; }
    .entry { flex-direction: column; gap: 0.3em; }
    .entry-mark { width: auto; }
    .sechead h2 { font-size: 1.4em; letter-spacing: 0.2em; }
  }
</style>
