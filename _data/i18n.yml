en:
  code: "en"
  html_lang: "en"
  label: "English"
  name: "Ryo Takahashi"
  name_sub: "高橋 亮"
  role: "Project Assistant Professor, Graduate School of Engineering, The University of Tokyo"
  org_short: "The University of Tokyo"
  tagline: "Toward whole-body wearables that need no battery and no wire"
  lead: "Toward a safe and comfortable life in what we wear, even in extreme environments. I turn clothing itself into a wireless power and data line, so that wearable computing can cover the whole body without batteries to replace or wires to route."
  meta_desc: "Ryo Takahashi, Project Assistant Professor at the University of Tokyo (UTokyo). Turning clothing itself into wireless power and data lines, for battery-free full-body wearable computing."
