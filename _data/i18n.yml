  org_short: "东京大学"
  tagline: "迈向无需电池与布线的全身可穿戴设备"
  lead: "以即使在极端环境中也能安心舒适的「衣」生活为目标，我把衣服本身变成无线的电力线与通信线，让可穿戴计算覆盖全身，既不必更换电池，也不必布线。"
  meta_desc: "高桥亮（Ryo Takahashi）。东京大学（东大）大学院工学系研究科 电气系工学专业 特任助教。把衣服本身变成无线的电力线与通信线，研究无需电池、无需布线的全身可穿戴计算。"
