  bio: >
    2023年に東京大学大学院工学系研究科にて博士（工学）を取得（指導教員：川原圭博 教授）。
    在学中の2022年には Meta Reality Labs にてリサーチサイエンティストインターン（Hrvoje Benko 教授、Eric Whitmire 博士）を経験し、
    2023年より現職。ACM CHI と IEEE RA-L の双方で筆頭著者として最優秀論文賞を受賞しているほか、
    ACM UbiComp Gaetano Borriello Outstanding Student Award なども受賞。
    現在は JST さきがけ「激しい動きにも耐える全身分散スキン知能ネットワーク」の研究代表者、
    JST CRONOS「生体データ通信インフラの無線フルボディ化」の共同研究代表者を務めている。
  research_intro: "衣服・テキスタイルを電磁的なインフラとして捉え直し、身につけるものすべてから電池と配線をなくすことを目指しています。"
