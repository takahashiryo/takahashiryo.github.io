  org_short: "東京大学"
  tagline: "電池も配線もいらない、全身のウェアラブルへ"
  lead: "極限環境でも、安心・快適な衣（異）生活を目指して、衣服そのものを無線の電力線・通信線に変えることで、電池交換も配線もいらない全身スケールのウェアラブルコンピューティングを研究しています。"
  meta_desc: "高橋亮（たかはし りょう）。東京大学（東大）大学院工学系研究科 電気系工学専攻 特任助教。衣服そのものを無線の電力線・通信線に変え、電池も配線もいらない全身スケールのウェアラブルコンピューティングを研究しています。"
