    2023年于东京大学大学院工学系研究科取得工学博士学位（导师：川原圭博 教授）。
    2022年曾在 Meta Reality Labs 担任研究科学家实习生（导师：Hrvoje Benko 教授、Eric Whitmire 博士）。
    作为第一作者同时获得 ACM CHI 与 IEEE RA-L 的最佳论文奖，并获得
    ACM UbiComp Gaetano Borriello Outstanding Student Award 等奖项。
    目前担任 JST PRESTO 项目「面向剧烈运动的全身分布式皮肤智能网络」的研究负责人，
    并作为共同研究负责人参与 JST CRONOS「生体数据通信基础设施的无线全身化」项目。
  research_intro: "我将衣服与纺织品重新视为电磁基础设施，目标是让所有穿戴之物摆脱电池与布线。"
