  bio: >
    I received my PhD in Engineering from the University of Tokyo in 2023, advised by Prof. Yoshihiro Kawahara.
    In 2022 I worked as a research scientist intern at Meta Reality Labs, advised by Prof. Hrvoje Benko and Dr. Eric Whitmire.
    I have received best paper awards as a first author at both ACM CHI and IEEE RA-L, as well as the
    ACM UbiComp Gaetano Borriello Outstanding Student Award.
    I currently lead a JST PRESTO project on motion-robust body-scale distributed skin intelligence networks,
    and serve as a co-PI of the JST CRONOS project on full-body wireless power and data networking.
  research_intro: "I treat clothing and textiles as electromagnetic infrastructure, with the goal of removing batteries and wiring from everything we wear."
