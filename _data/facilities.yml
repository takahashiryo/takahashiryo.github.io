        desc: "配备 2 路 14 位、0.5 GS/s 模拟输入与 16 路数字输入的 USB 多功能仪器。集示波器、波形发生器、逻辑分析仪于一体。"
        uses:
          - "自动测量与数据记录的脚本化"
