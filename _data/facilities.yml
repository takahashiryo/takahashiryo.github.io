        desc: "300 kHz〜8.5 GHz 的 USB 双端口 VNA。四接收机架构提供 124 dB 动态范围，每秒可完成 5,500 次以上 S 参数测量。"
        specs:
          - "频率 300 kHz〜8.5 GHz，双端口"
          - "动态范围 124 dB（10 Hz 带宽）"
          - "S 参数测量最高 5,500 次/秒，四接收机架构"
          - "USB 连接，可导出 Touchstone（.s2p）"

