    - id: "joulescope-js320"
      name: "Joulescope JS320"
      maker: "Jetperch"
      image: "joulescope-js320.jpg"
      qty: 2
      ja:
        desc: "電流・電圧を 24 ビットで同時に測る精密 DC エネルギーアナライザ。±3 A・±15 V を 1 MS/s で記録し、0.1 nA 分解能でスリープから動作時まで追える。"
        uses:
          - "指輪・センサノードなど低電力ウェアラブルの消費電力とバッテリー寿命の見積もり"
