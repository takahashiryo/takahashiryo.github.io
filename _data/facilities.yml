# 研究設備（Facilities ページ）。カテゴリ → 機器 の2段。上から順に並ぶ。
# カテゴリ: id, ja/en/zh の name, devices。
# 機器: id, name（製品名。原語のまま）, maker, image（images/facilities/ 内のファイル名。無ければ空）,
#       ja/en/zh の desc（説明1段落）と uses（主な用途、箇条書き）。
# devices が空のカテゴリは「準備中」と出る。
# 写真は sips -s format jpeg -s formatOptions 85 --resampleWidth 1200 入力 --out images/facilities/<id>.jpg で作る。

- id: "rf"
  ja: { name: "RF 計測" }
  en: { name: "RF measurement" }
  zh: { name: "射频测量" }
  devices:

    - id: "picovna-108"
      name: "PicoVNA 108"
      maker: "Pico Technology"
      image: ""
      ja:
        desc: "300 kHz〜8.5 GHz をカバーする USB 接続の 2 ポート・ベクトルネットワークアナライザ。4 受信機構成で 124 dB のダイナミックレンジを持ち、毎秒 5,500 回を超える S パラメータ測定ができる。PC 上のソフトウェアから制御し、Touchstone（.s2p）ファイルをそのまま書き出せる。"
        uses:
          - "メアンダコイル・アンテナのインピーダンスと共振周波数の測定"
          - "コイル間の結合係数（S21）と伝送効率の評価"
          - "NFC / 無線給電回路の整合設計"
      en:
        desc: "USB-connected two-port vector network analyzer covering 300 kHz to 8.5 GHz. Its four-receiver architecture gives 124 dB of dynamic range and more than 5,500 S-parameter sweeps per second. Controlled from a PC, it exports Touchstone (.s2p) files directly."
        uses:
          - "Impedance and resonance measurement of meander coils and antennas"
          - "Coil-to-coil coupling (S21) and power-transfer efficiency"
          - "Matching design for NFC and wireless-power circuits"
      zh:
        desc: "覆盖 300 kHz 至 8.5 GHz 的 USB 双端口矢量网络分析仪。四接收机架构提供 124 dB 动态范围，每秒可完成 5,500 次以上 S 参数测量。由电脑软件控制，可直接导出 Touchstone（.s2p）文件。"
        uses:
          - "蛇形线圈与天线的阻抗和谐振频率测量"
          - "线圈间耦合系数（S21）与传输效率评估"
          - "NFC / 无线供电电路的匹配设计"

    - id: "sv6301a"
      name: "SV6301A"
      maker: "Chelegance"
      image: ""
      ja:
        desc: "1 MHz〜6.3 GHz、7 インチのタッチパネルを備えたハンドヘルド型ベクトルネットワークアナライザ。S11 / S21 の測定、スミスチャート表示、TDR によるケーブル長測定ができ、バッテリー駆動で PC なしに使える。"
        uses:
          - "服やロボットに組み込んだコイルのその場での共振確認"
          - "実験室外・デモ会場での簡易的なアンテナ測定"
          - "ケーブル・コネクタの断線や長さの確認"
      en:
        desc: "Handheld vector network analyzer covering 1 MHz to 6.3 GHz with a 7-inch touchscreen. It measures S11 and S21, shows Smith charts and can find cable lengths by TDR, running on battery without a PC."
        uses:
          - "On-the-spot resonance checks of coils built into garments and robots"
          - "Quick antenna measurements outside the lab or at demo venues"
          - "Checking cables and connectors for breaks and length"
      zh:
        desc: "覆盖 1 MHz 至 6.3 GHz、配备 7 英寸触摸屏的手持式矢量网络分析仪。可测量 S11 / S21、显示史密斯圆图，并通过 TDR 测量电缆长度，电池供电，无需电脑。"
        uses:
          - "现场确认衣物和机器人中线圈的谐振"
          - "实验室外或演示现场的简易天线测量"
          - "检查电缆、连接器的断线与长度"

    - id: "nanovna"
      name: "NanoVNA"
      maker: ""
      image: ""
      ja:
        desc: "手のひらに収まる小型のベクトルネットワークアナライザ。数十 kHz から GHz 帯までの S11 / S21 を測定でき、バッテリー内蔵で持ち運べる。安価なので学生一人ひとりに配って使える。"
        uses:
          - "試作コイルの共振周波数のざっくりした確認"
          - "学生実験・演習での VNA 入門"
          - "フィールドでのアンテナ調整"
      en:
        desc: "Palm-sized vector network analyzer that measures S11 and S21 from tens of kHz into the GHz range, with a built-in battery. It is inexpensive enough to hand one to every student."
        uses:
          - "Rough resonance checks of prototype coils"
          - "Introduction to VNA measurement in student labs"
          - "Antenna tuning in the field"
      zh:
        desc: "可握于掌中的小型矢量网络分析仪。可测量数十 kHz 至 GHz 频段的 S11 / S21，内置电池便于携带。价格低廉，可为每位学生配备一台。"
        uses:
          - "试制线圈谐振频率的粗略确认"
          - "学生实验与练习中的 VNA 入门"
          - "现场的天线调整"

    - id: "ssa3032x-r"
      name: "SSA3032X-R"
      maker: "Siglent"
      image: ""
      ja:
        desc: "9 kHz〜3.2 GHz のリアルタイムスペクトラムアナライザ。25 MHz のリアルタイム帯域とスペクトログラム表示で、ホッピングや瞬間的な信号も捉えられる。トラッキングジェネレータと VNA 機能を標準で備え、10.1 インチのタッチ画面で操作する。"
        uses:
          - "13.56 MHz / 6.78 MHz 帯の無線給電・NFC 信号の観測"
          - "不要輻射（スプリアス）と EMC の事前確認"
          - "トラッキングジェネレータによるフィルタ・コイルの周波数特性測定"
      en:
        desc: "Real-time spectrum analyzer covering 9 kHz to 3.2 GHz. Its 25 MHz real-time bandwidth and spectrogram view capture hopping and transient signals. A tracking generator and VNA mode are included, operated from a 10.1-inch touchscreen."
        uses:
          - "Observing wireless-power and NFC signals in the 13.56 MHz and 6.78 MHz bands"
          - "Pre-checks of spurious emissions and EMC"
          - "Frequency response of filters and coils with the tracking generator"
      zh:
        desc: "覆盖 9 kHz 至 3.2 GHz 的实时频谱分析仪。25 MHz 实时带宽与频谱图显示可捕捉跳频与瞬时信号。标配跟踪发生器与 VNA 功能，通过 10.1 英寸触摸屏操作。"
        uses:
          - "观测 13.56 MHz / 6.78 MHz 频段的无线供电与 NFC 信号"
          - "杂散辐射与 EMC 的预先确认"
          - "用跟踪发生器测量滤波器与线圈的频率特性"

    - id: "spectran-v6-eco"
      name: "SPECTRAN V6 ECO"
      maker: "Aaronia"
      image: ""
      ja:
        desc: "9 kHz〜6 GHz の USB 接続リアルタイムスペクトラムアナライザ。44 MHz のリアルタイム帯域と 16 ビット ADC を持ち、6 GHz 全域を 2 ms で掃引できる。USB-C 給電なのでノート PC と一緒に持ち運べ、RTSA-Suite PRO で複数台を同時に扱える。"
        uses:
          - "人体周りの電磁界分布の走査・可視化"
          - "Bluetooth / Wi-Fi 帯との干渉確認"
          - "デモ会場での持ち運び計測"
      en:
        desc: "USB real-time spectrum analyzer covering 9 kHz to 6 GHz, with 44 MHz real-time bandwidth and a 16-bit ADC that sweeps the full 6 GHz in 2 ms. Powered over USB-C, it travels with a laptop, and RTSA-Suite PRO can run several units at once."
        uses:
          - "Scanning and visualizing the electromagnetic field around the body"
          - "Checking interference with the Bluetooth and Wi-Fi bands"
          - "Portable measurements at demo venues"
      zh:
        desc: "覆盖 9 kHz 至 6 GHz 的 USB 实时频谱分析仪。具备 44 MHz 实时带宽与 16 位 ADC，可在 2 ms 内扫描整个 6 GHz 频段。USB-C 供电，可与笔记本电脑一同携带，RTSA-Suite PRO 可同时管理多台设备。"
        uses:
          - "扫描并可视化人体周围的电磁场分布"
          - "确认与 Bluetooth / Wi-Fi 频段的干扰"
          - "演示现场的便携测量"

    - id: "mso44b"
      name: "MSO44B"
      maker: "Tektronix"
      image: ""
      ja:
        desc: "4 シリーズ B のミックスドシグナルオシロスコープ。12 ビット分解能、6.25 GS/s、4 本のアナログ入力に加え、各チャンネルを 8 本のデジタル入力に切り替えられる FlexChannel 構成。13.3 インチの HD タッチ画面で波形とスペクトルを同時に見られる。"
        uses:
          - "無線給電回路のスイッチング波形・整流波形の観測"
          - "センサノードの I2C / SPI / UART 通信のデコード"
          - "低電力デバイスの電流波形と消費電力の評価"
      en:
        desc: "4 Series B mixed-signal oscilloscope with 12-bit resolution, 6.25 GS/s and four analog inputs, each of which can become eight digital inputs (FlexChannel). Waveforms and spectra are viewed together on a 13.3-inch HD touchscreen."
        uses:
          - "Switching and rectifier waveforms in wireless-power circuits"
          - "Decoding I2C, SPI and UART traffic of sensor nodes"
          - "Current waveforms and power consumption of low-power devices"
      zh:
        desc: "4 系列 B 混合信号示波器。12 位分辨率、6.25 GS/s、4 路模拟输入，且每路可切换为 8 路数字输入（FlexChannel）。13.3 英寸高清触摸屏可同时显示波形与频谱。"
        uses:
          - "观测无线供电电路的开关波形与整流波形"
          - "解码传感器节点的 I2C / SPI / UART 通信"
          - "评估低功耗器件的电流波形与功耗"

    - id: "mho98"
      name: "MHO98"
      maker: "Rigol"
      image: ""
      ja:
        desc: "1 GHz 帯域、4 GSa/s、12 ビット分解能のミックスドシグナルオシロスコープ。4 本のアナログと 16 本のデジタル入力、500 Mpts のメモリ、100 MHz の 2 チャンネル波形発生器を備え、USB-C で給電できるので持ち運びやすい。"
        uses:
          - "ロボット・ウェアラブルの基板デバッグ"
          - "長時間のセンサ信号記録"
          - "出張先・デモ会場での波形観測"
      en:
        desc: "Mixed-signal oscilloscope with 1 GHz bandwidth, 4 GSa/s and 12-bit resolution. It has four analog and 16 digital inputs, 500 Mpts of memory and a two-channel 100 MHz waveform generator, and runs on USB-C power for easy transport."
        uses:
          - "Board-level debugging of robots and wearables"
          - "Long-duration recording of sensor signals"
          - "Waveform checks on the road and at demo venues"
      zh:
        desc: "1 GHz 带宽、4 GSa/s、12 位分辨率的混合信号示波器。配备 4 路模拟与 16 路数字输入、500 Mpts 存储深度以及 100 MHz 双通道波形发生器，USB-C 供电便于携带。"
        uses:
          - "机器人与可穿戴设备的电路板调试"
          - "长时间记录传感器信号"
          - "出差与演示现场的波形观测"

    - id: "adp3250"
      name: "Analog Discovery Pro ADP3250"
      maker: "Digilent"
      image: ""
      ja:
        desc: "2 チャンネル・14 ビット・最大 0.5 GS/s のアナログ入力と 16 本のデジタル入力を持つ USB 接続の多機能計測器。オシロスコープ、波形発生器、ロジックアナライザ、電圧計などを 1 台にまとめ、WaveForms から Python でも制御できる。"
        uses:
          - "自動計測・データロギングのスクリプト化"
          - "ミックスドシグナル回路のデバッグ"
          - "研究室内の共用ベンチ計測器"
      en:
        desc: "USB multi-instrument with two 14-bit analog inputs at up to 0.5 GS/s and 16 digital inputs. It combines an oscilloscope, waveform generator, logic analyzer and voltmeter in one box, and can be scripted from WaveForms or Python."
        uses:
          - "Scripted automated measurement and data logging"
          - "Debugging mixed-signal circuits"
          - "Shared bench instrument in the lab"
      zh:
        desc: "配备 2 路 14 位、最高 0.5 GS/s 模拟输入与 16 路数字输入的 USB 多功能测量仪。将示波器、波形发生器、逻辑分析仪、电压表等集成于一体，可通过 WaveForms 或 Python 控制。"
        uses:
          - "自动测量与数据记录的脚本化"
          - "混合信号电路调试"
          - "实验室共用台式仪器"

    - id: "ad3"
      name: "Analog Discovery 3"
      maker: "Digilent"
      image: ""
      ja:
        desc: "オシロスコープ、波形発生器、ロジックアナライザ、可変電源などを 1 台にまとめた手のひらサイズの USB 計測器。2 チャンネル・14 ビット・125 MS/s のアナログ入出力と 16 本のデジタル I/O を備え、WaveForms から Python でも扱える。学生や個人のラボに最適。"
        uses:
          - "学生一人ひとりの机上での回路試作・デバッグ"
          - "信号生成とミックスドシグナル解析"
          - "遠隔・自宅での実験"
      en:
        desc: "Palm-sized USB instrument that bundles an oscilloscope, waveform generator, logic analyzer and variable power supply. It offers two 14-bit, 125 MS/s analog inputs and outputs plus 16 digital I/O, controllable from WaveForms or Python. Ideal for individual and student benches."
        uses:
          - "Personal circuit prototyping and debugging at each student's desk"
          - "Signal generation and mixed-signal analysis"
          - "Remote and at-home experiments"
      zh:
        desc: "将示波器、波形发生器、逻辑分析仪、可调电源等集成于一体的掌上型 USB 测量仪。具备 2 路 14 位、125 MS/s 模拟输入输出与 16 路数字 I/O，可通过 WaveForms 或 Python 控制。适合学生与个人实验台。"
        uses:
          - "每位学生桌上的电路试制与调试"
          - "信号生成与混合信号分析"
          - "远程与居家实验"

    - id: "ads-max"
      name: "Analog Discovery Studio Max"
      maker: "Digilent"
      image: ""
      ja:
        desc: "教育・実験用に設計された 14 種の計測器入りワークベンチ。2 チャンネル・14 ビット・100 MS/s・50 MHz 帯域のオシロスコープ、波形発生器、デジタルマルチメータ、内蔵電源を、4 枚のブレッドボードと一体になった筐体に収めている。"
        uses:
          - "学生実験・演習での共用実験台"
          - "アナログとデジタルを合わせた回路実習"
          - "ブレッドボード上での素早い回路検証"
      en:
        desc: "Workbench for teaching and experiments that integrates 14 instruments: a two-channel 14-bit, 100 MS/s, 50 MHz oscilloscope, waveform generator, digital multimeter and built-in power supplies, housed together with four breadboards."
        uses:
          - "Shared bench for student labs and exercises"
          - "Hands-on circuit courses covering analog and digital"
          - "Quick circuit checks on the breadboard"
      zh:
        desc: "面向教学与实验设计的 14 合 1 仪器工作台。将 2 路 14 位、100 MS/s、50 MHz 带宽的示波器、波形发生器、数字万用表与内置电源，与 4 块面包板集成在同一机箱中。"
        uses:
          - "学生实验与练习的共用实验台"
          - "模拟与数字相结合的电路实训"
          - "面包板上的快速电路验证"

- id: "fab"
  ja: { name: "ファブリケーション" }
  en: { name: "Fabrication" }
  zh: { name: "制造加工" }
  devices:

    - id: "bambu-h2d"
      name: "H2D"
      maker: "Bambu Lab"
      image: ""
      ja:
        desc: "デュアルノズルのマルチマテリアル 3D プリンタ。造形サイズ 350×320×325 mm、最大 1,000 mm/s、ノズル温度 350 °C、最高 65 °C まで加熱できる密閉チャンバーを備え、ABS・PC・炭素繊維入りフィラメントも扱える。オプションのレーザーモジュールで切断・刻印もできる。"
        uses:
          - "ロボットの外装・関節部品や大型治具の造形"
          - "水溶性樹脂（PVA）と本体樹脂を組み合わせた 2 材料造形"
          - "エンジニアリングプラスチックによる耐熱・高強度部品"
      en:
        desc: "Dual-nozzle multi-material 3D printer with a 350 x 320 x 325 mm build volume, up to 1,000 mm/s, 350 °C nozzles and an enclosed chamber heated to 65 °C, so ABS, PC and carbon-fibre filaments print reliably. Optional laser modules add cutting and engraving."
        uses:
          - "Robot housings, joints and large jigs"
          - "Two-material prints combining water-soluble PVA with a body material"
          - "Heat-resistant, high-strength parts in engineering plastics"
      zh:
        desc: "双喷头多材料 3D 打印机。成型尺寸 350×320×325 mm，最高 1,000 mm/s，喷头温度 350 °C，密闭腔体可加热至 65 °C，可稳定打印 ABS、PC 与碳纤维材料。可选激光模块支持切割与雕刻。"
        uses:
          - "机器人外壳、关节部件与大型夹具的成型"
          - "水溶性树脂（PVA）与主体材料的双材料打印"
          - "工程塑料的耐热高强度零件"

    - id: "bambu-h2c"
      name: "H2C"
      maker: "Bambu Lab"
      image: ""
      ja:
        desc: "誘導加熱のツールチェンジャ「Vortek」を備えたマルチマテリアル 3D プリンタ。固定ノズルに加えて 6 本のホットエンドを 8 秒で切り替え、AMS を並列接続すれば 1 回の造形で最大 24 材料を扱える。造形サイズ 330×320×325 mm、密閉チャンバーは 65 °C まで加熱できる。"
        uses:
          - "多色・多材料のプロトタイプの一括造形"
          - "サポート材と本体材の切り替えが多い複雑形状"
          - "材料ごとの試し刷りを減らした短納期の試作"
      en:
        desc: "Multi-material 3D printer built around the inductively heated Vortek tool changer: besides a fixed nozzle it swaps among six hotends in 8 seconds, and with parallel AMS units handles up to 24 materials in one print. Build volume is 330 x 320 x 325 mm with a chamber heated to 65 °C."
        uses:
          - "Multi-colour, multi-material prototypes in a single job"
          - "Complex shapes with frequent support and body material changes"
          - "Fast turnaround prototyping with fewer test prints"
      zh:
        desc: "配备感应加热工具更换系统「Vortek」的多材料 3D 打印机。除固定喷头外，可在 8 秒内切换 6 个热端，并联 AMS 后单次打印最多可使用 24 种材料。成型尺寸 330×320×325 mm，密闭腔体可加热至 65 °C。"
        uses:
          - "多色多材料原型的一次成型"
          - "支撑材与主体材频繁切换的复杂形状"
          - "减少试打次数的快速试制"

    - id: "bambu-a1-mini"
      name: "A1 mini"
      maker: "Bambu Lab"
      image: ""
      ja:
        desc: "造形サイズ 180×180×180 mm の小型 3D プリンタ。最大 500 mm/s、自動キャリブレーション、動作音 49 dB と扱いやすく、AMS lite を付ければ 4 色・4 材料に対応する。"
        uses:
          - "指輪・リストバンドなど小物の筐体"
          - "学生の練習用・並列の試作"
          - "静かに動かしたい居室での小さな造形"
      en:
        desc: "Compact 3D printer with a 180 x 180 x 180 mm build volume, up to 500 mm/s, fully automatic calibration and only 49 dB of noise. With AMS lite it prints four colours or materials."
        uses:
          - "Enclosures for rings, wristbands and other small devices"
          - "Practice prints for students and parallel prototyping"
          - "Small parts in shared rooms where quiet operation matters"
      zh:
        desc: "成型尺寸 180×180×180 mm 的小型 3D 打印机。最高 500 mm/s，自动校准，噪音仅 49 dB，配合 AMS lite 可打印 4 色 / 4 种材料。"
        uses:
          - "戒指、腕带等小型设备的外壳"
          - "学生练习与并行试制"
          - "需要安静运行的办公室内的小型成型"

    - id: "xtool-p2s"
      name: "P2S"
      maker: "xTool"
      image: ""
      ja:
        desc: "55 W の卓上 CO2 レーザーカッター。加工範囲 600×305 mm、最大 600 mm/s、精度 0.01 mm。木材 18 mm・アクリル 20 mm まで一度に切断でき、2 台の 16 MP カメラで材料の上に図面を合わせられる。オプションのパススルーで長尺材にも対応する。"
        uses:
          - "アクリル・木材による治具・筐体・デモ台の加工"
          - "布・革・フィルムの型抜きと切断"
          - "テキスタイル用のパターンや位置合わせマスクの作成"
      en:
        desc: "55 W desktop CO2 laser cutter with a 600 x 305 mm work area, up to 600 mm/s and 0.01 mm precision. It cuts wood up to 18 mm and acrylic up to 20 mm in one pass, and two 16 MP cameras align designs on the material. An optional passthrough handles long stock."
        uses:
          - "Jigs, enclosures and demo stands in acrylic and wood"
          - "Die-cutting fabric, leather and film"
          - "Patterns and alignment masks for textiles"
      zh:
        desc: "55 W 桌面型 CO2 激光切割机。加工范围 600×305 mm，最高 600 mm/s，精度 0.01 mm。可一次切割 18 mm 木材与 20 mm 亚克力，两台 16 MP 摄像头可将图纸对准材料。可选直通模块支持长条材料。"
        uses:
          - "亚克力、木材制作的夹具、外壳与演示台"
          - "布料、皮革、薄膜的模切与切割"
          - "纺织品用图案与对位掩模的制作"

    - id: "mikasa-ms-b150"
      name: "MS-B150"
      maker: "ミカサ"
      image: ""
      ja:
        desc: "研究・小型ラボ向けの回転式スピンコーター。6 インチウェハや 100×100 mm の基板に対応し、回転数と時間をプログラムして均一な薄膜を塗布できる。"
        uses:
          - "伸縮エレクトロニクス用エラストマー（PDMS など）の薄膜作製"
          - "フォトレジスト・絶縁膜・保護膜の均一塗布"
          - "液体金属配線の封止層の形成"
      en:
        desc: "Rotary spin coater for research and small laboratories. It takes 6-inch wafers and 100 x 100 mm substrates, and programmable speed and time give uniform thin films."
        uses:
          - "Thin elastomer films (such as PDMS) for stretchable electronics"
          - "Uniform coating of photoresist, insulating and protective layers"
          - "Encapsulation layers for liquid-metal wiring"
      zh:
        desc: "面向研究与小型实验室的旋转式匀胶机（旋涂仪）。支持 6 英寸晶圆与 100×100 mm 基板，可编程设定转速与时间，获得均匀薄膜。"
        uses:
          - "可拉伸电子用弹性体（如 PDMS）薄膜的制备"
          - "光刻胶、绝缘层、保护层的均匀涂布"
          - "液态金属布线封装层的形成"

    - id: "hakko-fx-971"
      name: "FX-971"
      maker: "HAKKO"
      image: ""
      ja:
        desc: "100 W のデジタルはんだごてステーション。50〜450 °C で温度設定でき、標準とマイクロの 2 種のこて先ハンドルに対応する。プリセット温度 5 つ、スリープ・自動オフ、パスワードロックを備え、PC ソフトからこて先温度の記録もできる。"
        uses:
          - "センサノード・無線モジュール基板の実装と修正"
          - "0402 サイズなど微小部品のはんだ付け"
          - "導電糸・液体金属配線と基板の接続"
      en:
        desc: "100 W digital soldering station adjustable from 50 to 450 °C that drives both standard and micro handpieces. It offers five preset temperatures, sleep and auto shut-off, password lockout, and tip-temperature logging from PC software."
        uses:
          - "Assembling and reworking sensor-node and radio-module boards"
          - "Soldering tiny components down to 0402"
          - "Joining conductive yarn and liquid-metal wiring to PCBs"
      zh:
        desc: "100 W 数字焊台。温度可在 50〜450 °C 间设定，兼容标准与微型两种手柄。具备 5 组预设温度、休眠与自动关机、密码锁定，并可通过电脑软件记录烙铁头温度。"
        uses:
          - "传感器节点与无线模块电路板的焊接与返修"
          - "0402 等微小元件的焊接"
          - "导电纱、液态金属布线与电路板的连接"

    - id: "hakko-fr-850"
      name: "FR-850"
      maker: "HAKKO"
      image: ""
      ja:
        desc: "顕微鏡下で使える細身のマイクロホットエアステーション。50〜600 °C を 1 °C 刻みで設定でき、風量は 1.5〜5 L/min。φ1〜3 mm のノズルで微小部品だけを狙って加熱でき、USB-C で PC ソフトからプリセット管理もできる。"
        uses:
          - "0402・BGA など微小部品の取り外しと付け直し"
          - "無線モジュール・フレキ基板のリワーク"
          - "熱収縮チューブや小面積の局所加熱"
      en:
        desc: "Slim micro hot-air station usable under a microscope. Temperature is set from 50 to 600 °C in 1 °C steps with airflow of 1.5 to 5 L/min; nozzles of 1 to 3 mm heat only the target component, and USB-C links to PC software for presets."
        uses:
          - "Removing and replacing tiny parts such as 0402 and BGA packages"
          - "Rework of radio modules and flexible PCBs"
          - "Local heating of heat-shrink tubing and small areas"
      zh:
        desc: "可在显微镜下使用的细长型微型热风台。温度可在 50〜600 °C 间以 1 °C 为单位设定，风量 1.5〜5 L/min。φ1〜3 mm 喷嘴可只加热目标微小元件，并通过 USB-C 用电脑软件管理预设。"
        uses:
          - "0402、BGA 等微小元件的拆除与重焊"
          - "无线模块与柔性电路板的返修"
          - "热缩管与小面积的局部加热"

    - id: "hakko-fx-300"
      name: "FX-300"
      maker: "HAKKO"
      image: ""
      ja:
        desc: "50×50 mm のるつぼを持つアナログ式はんだ槽。200〜450 °C で ±5 °C に保温でき、鉛フリーはんだにも対応する。溶けたはんだに浸すだけで、線材の予備はんだや細線の一括処理ができる。"
        uses:
          - "導電糸・リッツ線・細線の端末への予備はんだ"
          - "多数の線材やピンヘッダの一括はんだ付け"
          - "フレキ基板の端子のはんだメッキ"
      en:
        desc: "Analog solder pot with a 50 x 50 mm crucible held at 200 to 450 °C within ±5 °C, compatible with lead-free solder. Dipping into the molten solder tins wire ends and processes many fine wires at once."
        uses:
          - "Tinning the ends of conductive yarn, litz wire and fine wires"
          - "Batch soldering of wire bundles and pin headers"
          - "Solder-plating terminals on flexible PCBs"
      zh:
        desc: "配备 50×50 mm 坩埚的模拟式锡炉。可在 200〜450 °C 间保持 ±5 °C，支持无铅焊锡。只需浸入熔融焊锡，即可对线材预镀锡并批量处理细线。"
        uses:
          - "导电纱、利兹线与细线端头的预镀锡"
          - "大量线材与排针的批量焊接"
          - "柔性电路板端子的镀锡"

    - id: "tecprint-700"
      name: "TECPRINT 700"
      maker: "CIF"
      image: ""
      ja:
        desc: "卓上の手動ステンシル印刷機。最大 300×400 mm の基板と 320×480 mm のメタルステンシルに対応し、取り付け穴のないステンシルも自動テンションフレームで数秒で固定できる。X・Y・θ を ±7 mm の範囲で微調整してからスキージで手引きし、はんだペーストを均一に塗布する。"
        uses:
          - "センサノード基板へのはんだペースト印刷"
          - "少量多品種の表面実装基板の試作"
          - "導電ペースト・接着剤のパターン塗布"
      en:
        desc: "Benchtop manual stencil printer for boards up to 300 x 400 mm and metal stencils up to 320 x 480 mm; a self-tensioning frame clamps stencils without mounting holes in seconds. After fine alignment in X, Y and theta (±7 mm), a hand squeegee lays down an even solder-paste deposit."
        uses:
          - "Solder-paste printing for sensor-node boards"
          - "Low-volume, high-mix surface-mount prototypes"
          - "Patterned deposition of conductive paste and adhesives"
      zh:
        desc: "桌面型手动钢网印刷机。支持最大 300×400 mm 的电路板与 320×480 mm 的金属钢网，自张紧框架可在数秒内固定无安装孔的钢网。可在 X、Y、θ 方向 ±7 mm 范围内微调后手动刮刷，均匀涂布焊膏。"
        uses:
          - "传感器节点电路板的焊膏印刷"
          - "小批量多品种表面贴装板的试制"
          - "导电胶与粘合剂的图案涂布"

    - id: "xtool-hp2"
      name: "HP2"
      maker: "xTool"
      image: ""
      ja:
        desc: "381×381 mm の熱盤を持つ全自動ヒートプレス。押し下げ・加熱・カウント・持ち上げを自動で行い、60〜180 kg の 4 段階の圧力と 5 つのプリセットを使い分けられる。15 分放置で自動停止する。"
        uses:
          - "フレキ基板・チップ部品のテキスタイルへの熱圧着"
          - "転写フィルムや熱接着シートによる導電パターンの貼り付け"
          - "電子ニット・給電服の封止と防水加工"
      en:
        desc: "Fully automatic heat press with a 381 x 381 mm platen that lowers, heats, counts and lifts on its own. Four pressure levels from 60 to 180 kg and five presets cover different materials, and it shuts off after 15 minutes idle."
        uses:
          - "Heat-bonding flexible PCBs and chip components onto textiles"
          - "Attaching conductive patterns with transfer films and hot-melt sheets"
          - "Sealing and waterproofing e-knits and wireless-power garments"
      zh:
        desc: "配备 381×381 mm 热板的全自动热压机。压下、加热、计时、抬起全程自动，具备 60〜180 kg 四档压力与 5 组预设，闲置 15 分钟自动关机。"
        uses:
          - "柔性电路板与贴片元件在纺织品上的热压粘接"
          - "用转印膜或热熔片贴附导电图案"
          - "电子针织物与供电服装的封装与防水加工"

    - id: "and-mct-2150w"
      name: "MCT-2150W"
      maker: "エー・アンド・デイ（A&D）"
      image: ""
      ja:
        desc: "低試験力タイプの卓上引張圧縮試験機（フォーステスター）。試験力を 0.001 N 分解能で表示し、カラータッチパネルで速度と変位を設定して自動試験する。付属ソフト MSAT-Lite で PC に荷重・変位を取り込める。"
        uses:
          - "液体金属配線とコンデンサ接合部の引張・曲げ耐力の測定"
          - "電子ニット・伸縮配線の繰り返し伸縮試験"
          - "磁石コネクタや接着接合の保持力評価"
      en:
        desc: "Low-force benchtop tensile and compression tester that displays force with 0.001 N resolution. Speed and displacement are set on a colour touch panel for automated tests, and the bundled MSAT-Lite software logs load and displacement to a PC."
        uses:
          - "Tensile and bending strength of liquid-metal-to-capacitor joints"
          - "Cyclic stretch tests of e-knits and stretchable wiring"
          - "Holding force of magnetic connectors and adhesive joints"
      zh:
        desc: "低试验力型桌面拉伸压缩试验机（力测试仪）。试验力显示分辨率 0.001 N，可在彩色触摸屏上设定速度与位移进行自动测试，附带软件 MSAT-Lite 可将载荷与位移记录到电脑。"
        uses:
          - "液态金属布线与电容接合处的拉伸、弯曲强度测量"
          - "电子针织物与可拉伸布线的反复拉伸试验"
          - "磁性连接器与粘接接合的保持力评估"

    - id: "asone-incubator"
      name: "パーソナルインキュベータ"
      maker: "アズワン（AS ONE）"
      image: ""
      ja:
        desc: "卓上に置ける小型の恒温器。一定温度に保った庫内で試料を静置でき、樹脂やシリコーンの硬化、接着剤の養生、温度をそろえた保管に使う。"
        uses:
          - "PDMS・シリコーン封止材の加熱硬化"
          - "導電性接着剤・エポキシの養生"
          - "試料・材料の一定温度での保管"
      en:
        desc: "Compact benchtop incubator that keeps its chamber at a set temperature. Used for curing resins and silicones, letting adhesives set, and storing samples at a constant temperature."
        uses:
          - "Heat-curing PDMS and silicone encapsulants"
          - "Curing conductive adhesives and epoxies"
          - "Storing samples and materials at a constant temperature"
      zh:
        desc: "可放置于桌面的小型恒温箱。可在恒定温度的腔体内静置样品，用于树脂与硅胶的固化、粘合剂的养护以及恒温保存。"
        uses:
          - "PDMS 与硅胶封装材料的加热固化"
          - "导电胶与环氧树脂的养护"
          - "样品与材料的恒温保存"

