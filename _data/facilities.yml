# 研究設備（Facilities ページ）。カテゴリ → 機器種別 → 型番 の3段。上から順に並ぶ。
# カテゴリ: id（英数字）, image（images/facilities/ 内のファイル名。無ければ空）, ja/en/zh の name, items。
# items: ja/en/zh の name（機器種別）と models（型番の配列。原語のまま、翻訳しない）。
# items が空のカテゴリは「準備中」と出る。
# 写真は sips -s format jpeg -s formatOptions 85 --resampleWidth 1200 入力 --out images/facilities/<id>.jpg で作る。

- id: "rf"
  image: ""
  ja: { name: "RF 計測" }
  en: { name: "RF measurement" }
  zh: { name: "射频测量" }
  items:
    - ja: { name: "ベクトルネットワークアナライザ（VNA）" }
      en: { name: "Vector network analyzer (VNA)" }
      zh: { name: "矢量网络分析仪（VNA）" }
      models: ["PicoVNA 108", "SV6031A", "NanoVNA"]
    - ja: { name: "スペクトラムアナライザ" }
      en: { name: "Spectrum analyzer" }
      zh: { name: "频谱分析仪" }
      models: ["SSA3032X-R", "SPECTRAN V6 ECO"]
    - ja: { name: "オシロスコープ" }
      en: { name: "Oscilloscope" }
      zh: { name: "示波器" }
      models: ["Tektronix MSO44B", "MHO98"]
    - ja: { name: "マルチメータ" }
      en: { name: "Multimeter" }
      zh: { name: "万用表" }
      models: ["ADP3250", "AD3", "Digilent Analog Discovery Studio Max"]

- id: "pcb"
  image: ""
  ja: { name: "基板実装（PCB）" }
  en: { name: "PCB fabrication" }
  zh: { name: "PCB 制作" }
  items: []

- id: "robot"
  image: ""
  ja: { name: "ロボット" }
  en: { name: "Robots" }
  zh: { name: "机器人" }
  items: []
