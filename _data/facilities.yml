# 研究設備（Facilities ページ）。カテゴリ → 機器 の2段。上から順に並ぶ。
# カテゴリ: id, ja/en/zh の name, devices。
# 機器: id, name（製品名。原語のまま）, maker, image（images/facilities/ 内のファイル名。無ければ空）, qty（2台以上なら台数）,
#       ja/en/zh の desc（説明1段落）と uses（主な用途、箇条書き）または specs（仕様、箇条書き）。両方あれば両方出る。
# devices が空のカテゴリは「準備中」と出る。
# 写真は sips -s format jpeg -s formatOptions 85 --resampleWidth 1200 入力 --out images/facilities/<id>.jpg で作る。

- id: "rf"
  ja: { name: "計測" }
  en: { name: "Measurement" }
  zh: { name: "测量" }
  devices:

    - id: "picovna-108"
      name: "PicoVNA 108"
      maker: "Pico Technology"
      image: "picovna-108-2.jpg"
      ja:
        desc: "300 kHz〜8.5 GHz の USB 接続 2 ポート VNA。4 受信機構成で 124 dB のダイナミックレンジ、毎秒 5,500 回超の S パラメータ測定。"
        uses:
          - "メアンダコイル・アンテナのインピーダンスと共振周波数の測定"
          - "コイル間の結合係数（S21）と伝送効率の評価"
          - "NFC / 無線給電回路の整合設計"
      en:
        desc: "USB two-port VNA covering 300 kHz to 8.5 GHz. Four receivers give 124 dB dynamic range and over 5,500 S-parameter sweeps per second."
        uses:
          - "Impedance and resonance measurement of meander coils and antennas"
          - "Coil-to-coil coupling (S21) and power-transfer efficiency"
          - "Matching design for NFC and wireless-power circuits"
      zh:
        desc: "300 kHz〜8.5 GHz 的 USB 双端口 VNA。四接收机架构提供 124 dB 动态范围，每秒可完成 5,500 次以上 S 参数测量。"
        uses:
          - "蛇形线圈与天线的阻抗和谐振频率测量"
          - "线圈间耦合系数（S21）与传输效率评估"
          - "NFC / 无线供电电路的匹配设计"

    - id: "sv6301a"
      name: "SV6301A"
      maker: "Chelegance"
      image: "sv6301a.jpg"
      ja:
        desc: "1 MHz〜6.3 GHz、7 インチタッチ画面のハンドヘルド VNA。S11 / S21、スミスチャート、TDR に対応し、バッテリーで PC なしに使える。"
        uses:
          - "服やロボットに組み込んだコイルのその場での共振確認"
          - "実験室外・デモ会場での簡易的なアンテナ測定"
          - "ケーブル・コネクタの断線や長さの確認"
      en:
        desc: "Handheld VNA for 1 MHz to 6.3 GHz with a 7-inch touchscreen. Measures S11/S21, Smith charts and TDR, and runs on battery without a PC."
        uses:
          - "On-the-spot resonance checks of coils built into garments and robots"
          - "Quick antenna measurements outside the lab or at demo venues"
          - "Checking cables and connectors for breaks and length"
      zh:
        desc: "1 MHz〜6.3 GHz、7 英寸触摸屏的手持式 VNA。支持 S11 / S21、史密斯圆图与 TDR，电池供电，无需电脑。"
        uses:
          - "现场确认衣物和机器人中线圈的谐振"
          - "实验室外或演示现场的简易天线测量"
          - "检查电缆、连接器的断线与长度"

    - id: "nanovna"
      name: "NanoVNA"
      maker: ""
      image: "nanovna-2.jpg"
      ja:
        desc: "手のひらサイズの小型 VNA。数十 kHz〜GHz 帯の S11 / S21 を測れ、バッテリー内蔵。安価なので学生一人ひとりに配れる。"
        uses:
          - "試作コイルの共振周波数のざっくりした確認"
          - "学生実験・演習での VNA 入門"
          - "フィールドでのアンテナ調整"
      en:
        desc: "Palm-sized VNA measuring S11/S21 from tens of kHz into the GHz range, with a built-in battery. Cheap enough to hand one to every student."
        uses:
          - "Rough resonance checks of prototype coils"
          - "Introduction to VNA measurement in student labs"
          - "Antenna tuning in the field"
      zh:
        desc: "掌上型小型 VNA。可测量数十 kHz〜GHz 频段的 S11 / S21，内置电池。价格低廉，可为每位学生配备。"
        uses:
          - "试制线圈谐振频率的粗略确认"
          - "学生实验与练习中的 VNA 入门"
          - "现场的天线调整"

    - id: "ssa3032x-r"
      name: "SSA3032X-R"
      maker: "Siglent"
      image: "ssa3032x-r.jpg"
      ja:
        desc: "9 kHz〜3.2 GHz のリアルタイムスペアナ。25 MHz のリアルタイム帯域とスペクトログラムで瞬間的な信号も捉え、TG と VNA 機能を標準装備。"
        uses:
          - "13.56 MHz / 6.78 MHz 帯の無線給電・NFC 信号の観測"
          - "不要輻射（スプリアス）と EMC の事前確認"
          - "トラッキングジェネレータによるフィルタ・コイルの周波数特性測定"
      en:
        desc: "Real-time spectrum analyzer for 9 kHz to 3.2 GHz. 25 MHz real-time bandwidth and spectrogram views catch transient signals; TG and VNA mode included."
        uses:
          - "Observing wireless-power and NFC signals in the 13.56 MHz and 6.78 MHz bands"
          - "Pre-checks of spurious emissions and EMC"
          - "Frequency response of filters and coils with the tracking generator"
      zh:
        desc: "9 kHz〜3.2 GHz 的实时频谱仪。25 MHz 实时带宽与频谱图可捕捉瞬时信号，标配跟踪发生器与 VNA 功能。"
        uses:
          - "观测 13.56 MHz / 6.78 MHz 频段的无线供电与 NFC 信号"
          - "杂散辐射与 EMC 的预先确认"
          - "用跟踪发生器测量滤波器与线圈的频率特性"

    - id: "spectran-v6-eco"
      name: "SPECTRAN V6 ECO"
      maker: "Aaronia"
      image: "spectran-v6-eco.jpg"
      ja:
        desc: "9 kHz〜6 GHz の USB リアルタイムスペアナ。44 MHz のリアルタイム帯域、16 ビット ADC、6 GHz を 2 ms で掃引。USB-C 給電で持ち運べる。"
        uses:
          - "人体周りの電磁界分布の走査・可視化"
          - "Bluetooth / Wi-Fi 帯との干渉確認"
          - "デモ会場での持ち運び計測"
      en:
        desc: "USB real-time spectrum analyzer for 9 kHz to 6 GHz with 44 MHz real-time bandwidth and a 16-bit ADC; sweeps 6 GHz in 2 ms and runs on USB-C power."
        uses:
          - "Scanning and visualizing the electromagnetic field around the body"
          - "Checking interference with the Bluetooth and Wi-Fi bands"
          - "Portable measurements at demo venues"
      zh:
        desc: "9 kHz〜6 GHz 的 USB 实时频谱仪。44 MHz 实时带宽、16 位 ADC，2 ms 扫完 6 GHz，USB-C 供电便于携带。"
        uses:
          - "扫描并可视化人体周围的电磁场分布"
          - "确认与 Bluetooth / Wi-Fi 频段的干扰"
          - "演示现场的便携测量"

    - id: "mso44b"
      name: "MSO44B"
      maker: "Tektronix"
      image: "mso44b-2.jpg"
      ja:
        desc: "帯域 350 MHz、12 ビット、6.25 GS/s のミックスドシグナルオシロ。4 アナログ入力は各 8 本のデジタル入力に切り替え可能。13.3 インチ HD タッチ画面。"
        uses:
          - "無線給電回路のスイッチング波形・整流波形の観測"
          - "センサノードの I2C / SPI / UART 通信のデコード"
          - "低電力デバイスの電流波形と消費電力の評価"
      en:
        desc: "Mixed-signal oscilloscope with 350 MHz bandwidth, 12-bit resolution and 6.25 GS/s. Each of four analog inputs can become eight digital inputs; 13.3-inch HD touchscreen."
        uses:
          - "Switching and rectifier waveforms in wireless-power circuits"
          - "Decoding I2C, SPI and UART traffic of sensor nodes"
          - "Current waveforms and power consumption of low-power devices"
      zh:
        desc: "350 MHz 带宽、12 位、6.25 GS/s 的混合信号示波器。4 路模拟输入可各自切换为 8 路数字输入，13.3 英寸高清触摸屏。"
        uses:
          - "观测无线供电电路的开关波形与整流波形"
          - "解码传感器节点的 I2C / SPI / UART 通信"
          - "评估低功耗器件的电流波形与功耗"

