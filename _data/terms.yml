# CV の用語 → 英語の対応表。キー = _data/*.csv の日本語の値。
#
# 方針: CV（学歴・職歴・研究費・受賞）の中身は言語を問わず英語で出す。
#       日本語ページ・中文ページでも英語になる。
#       論文タイトルと講演タイトルは書誌情報なので原語のまま（ここでは扱わない）。
#
# なぜ CSV の列ではなくここに置くか:
#   これらの CSV は scripts/build_cv.py が researchmap から作り直すので、
#   列を足しても次の生成で消える。また researchmap 由来の *_en 列は
#   中身が日本語のままのものが多く、あてにできない（受賞は19件すべて同一だった）。
#
# 効き方: ここにある英語が最優先 → 無ければ CSV の *_en 列 → それも無ければ日本語。
#
# ★ = 公式の英語名が確認できず、こちらで訳したもの。要確認。

