# CV の用語の対訳表。キー = _data/*.csv の日本語の値。
#
# なぜ CSV の列ではなくここに置くか:
#   education / experience / grants / awards の CSV は scripts/build_cv.py が
#   researchmap から作り直すので、列を足しても次の生成で消える。
#   （publications の研究テーマひも付けを profile.yml に置いてあるのと同じ理由）
#
# 効き方: ここにある訳が最優先。無ければ CSV の *_en 列（英語ページのみ）、
#         それも無ければ日本語のまま。researchmap の *_en 列は中身が
#         日本語のままのものが多く、英語ページにも日本語が出ていた。
#
# 未対応: awards.csv の受賞名・団体名（34語）。学会名や大会名の固有名詞が多く、
#         訳し方を決めてから入れる。いまは日本語のまま出る。

