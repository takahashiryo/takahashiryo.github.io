# 研究テーマ（トップの Research セクション）
# match / exclude は関連論文を拾うキーワード（題名を小文字化して部分一致）。
# publications.csv はスプレッドシート同期で作り直されるので、ひも付けは CSV の列に持たせない。
# 日本語題名の論文は関連論文に出さない（_includes/pub_match.html で除外している）。
# 注意: "ring" のような短い語は powering / networking / jointing に部分一致するので使わない。
research:
  - id: "e-textile"
    image: "e-textile.jpg"
    match: ["meander", "e-textile", "e-knit", "textile", "knittable", "bodynet", "nfc",
            "clothing", "electric skin", "soft wearables",
            "メアンダ", "衣服", "衣類", "給電服", "服型", "テキスタイル", "電子ニット",
            "センサ", "センシング"]
    # 作り方が主題のものは digital-fabrication へ、指輪・リストバンドは
    # low-power-wearable へ寄せる。
    exclude: ["cuttable", "plug-n-play", "3d-printing", "wristband",
              "ロボット", "picoring", "指輪"]
    ja:
      title: "電子テキスタイル"
      body: "メアンダコイルを衣服の全面に編み込み、人体に安全なまま身体のどこにでも W 級の電力と通信を届ける。液体金属配線や機械編みによって、洗える・伸びる電子テキスタイルを作る。"
      detail:
        - "皮膚に貼るスキンデバイスを薄く柔らかいまま、皮膚に密着させるために、皮膚の近傍に強い電磁界を閉じ込めるメアンダコイル服により、人の周りにサーフェス型無線通信・給電ネットワークを作り、有線で繋げたときと同レベルの高い信頼性のある無線給電・通信をスキンデバイスへ行う。"
    en:
      title: "E-textiles"
      body: "Meander coils knitted across a whole garment deliver watt-level power and data anywhere on the body while staying safe to wear. Liquid-metal wiring and machine knitting make the fabric washable and stretchable."
      detail:
        - "To keep skin-attached devices thin, soft and in close contact with the skin, a meander-coil garment confines a strong electromagnetic field near the skin surface, forming a surface-type wireless power and communication network around the body. Skin devices are then powered and read out wirelessly with the same level of reliability as a wired connection."
    zh:
      title: "电子纺织品"
      body: "将蜿蜒线圈编织于整件衣服，在保证人体安全的前提下，向身体任意位置输送瓦级电力与数据。借助液态金属布线与机器编织，实现可水洗、可拉伸的电子纺织品。"
      detail:
        - "为了让贴附于皮肤的皮肤器件保持轻薄柔软并紧贴皮肤，用把强电磁场约束在皮肤近旁的蜿蜒线圈衣服，在人体周围构建表面型的无线通信与供电网络，以与有线连接同等的高可靠性，对皮肤器件进行无线供电与通信。"
  - id: "low-power-wearable"
    image: "low-power-wearable.jpg"
    # トップのカードに出す代表論文（題名は publications.csv と完全一致）。無ければ新しい順に自動で3件
    card_pubs:
      - "picoRing dual: ultralow-power bimanual ring controllers for everyday AR"
      - "Ultra-low-power ring-based wireless tinymouse"
      - "picoRing: battery-free rings for subtle thumb-to-index input"
      - "TelemetRing: A Batteryless and Wireless Ring-Shaped Keyboard using Passive Inductive Telemetry"
    match: ["picoring", "telemetring", "wristband", "ring-based", "ring mouse",
            "ring controller", "tinymouse", "thumb-to-index", "rings",
            "指輪", "リストバンド", "マウス", "キーボード"]
    ja:
      title: "極低電力ウェアラブル"
      body: "指輪とリストバンドのコイル間の磁気結合を読み取ることで、指輪側に無線チップを積まない入力デバイスを実現する。1回の充電で1か月以上動く。"
      detail:
        - "指輪に積める電池は 27 mAh に満たない。BLE のような無線は消費が大きく、連続使用は 1〜10 時間で尽きてしまう。頻繁な充電が操作を途切れさせる。"
        - "picoRing は指輪側に無線チップを積まない。リストバンドのコイルが、近くにある指輪コイルの周波数応答を読み取る「半受動誘導テレメトリ」で入力を伝える。指輪側の変調は最大 449 µW で、1回の充電で 600〜1000 時間動く。AR グラスのコントローラのように、日常のなかで長く身につけ続けられる入力装置を目指している。"
    en:
      title: "Ultra-low-power wearables"
      body: "Sensing the magnetic coupling between a ring coil and a wristband coil lets a ring work as an input device with no radio on the ring — over a month of use on a single charge."
      detail:
        - "A ring can hold less than 27 mAh of battery. Conventional radios such as BLE are too power-hungry for that budget, so a wireless ring lasts only 1-10 hours of continuous use, and frequent recharging keeps interrupting the interaction."
        - "picoRing puts no radio on the ring at all. A wristband coil reads the frequency response of the nearby ring coil through semi-passive inductive telemetry, and the ring modulates that response with at most 449 microwatts. One charge lasts roughly 600-1000 hours. The goal is an input device you can keep wearing all day, for instance as a controller for AR glasses."
    zh:
      title: "超低功耗可穿戴设备"
      body: "通过读取戒指线圈与腕带线圈之间的磁耦合，实现戒指端不搭载无线芯片的输入设备。一次充电可使用一个月以上。"
      detail:
        - "戒指内可容纳的电池不足 27 mAh。BLE 等常规无线功耗过高，连续使用仅能维持 1〜10 小时，频繁充电会不断打断操作。"
        - "picoRing 在戒指端完全不搭载无线芯片。腕带线圈通过「半被动电感遥测」读取邻近戒指线圈的频率响应，戒指端的调制功耗最高仅 449 微瓦，一次充电可运行约 600〜1000 小时。目标是做出可以整天佩戴的输入设备，例如作为 AR 眼镜的控制器。"
  - id: "robot-skin"
    image: "robot-skin.jpg"
    # 2-D Relay Resonator Array は床面からの給電なのでロボット側に入れる
    match: ["robot", "snake", "locomotion", "relay resonator",
            "ロボット", "プラレール", "中継器", "共振器"]
    ja:
      title: "ワイヤフリーロボティクス・ロボットスキン"
      body: "ロボットから配線と電池をなくす。ヘビ型ロボットの体内や、壁面を走るカメラロボットの走行面に無線給電を組み込み、ケーブルの絡まりや電池交換に縛られないロボットを作る。"
      detail:
        - "ロボットの動きを縛っているのは、モータよりも配線と電池であることが多い。関節をまたぐケーブルは曲げ伸ばしのたびに絡まり、断線する。電池は機体の重さと稼働時間の上限を決めてしまう。そこで、ロボットの皮膚や走行面そのものを無線の電力線に変える。"
        - "ヘビ型ロボットでは、モータ関節が体内のラックギアに沿って移動するため、関節まで配線を引き回せない。柔らかいロボットスキンから体内の関節へ無線で給電することで、少ない関節数でも多関節のように曲がる 1.3 kg・7.6 W の機体を実現した（IEEE RA-L Best Paper Award）。"
        - "壁面を走るカメラロボットでは、壁に敷いたメアンダコイルの上を走りながら電力を受け取る。充電のために止まったり戻ったりする必要がないので、小型のまま屋内の広い範囲を長期間見守り続けられる。"
    en:
      title: "Wire-free robotics and robot skin"
      body: "Taking wires and batteries out of robots. Wireless power is built into the body of a snake robot and into the surface a wall-running camera robot drives on, so cable tangles and battery swaps no longer limit what the robot can do."
      detail:
        - "What holds a robot back is often not its motors but its wiring and batteries. Cables that cross a joint tangle and break as the body bends, and batteries cap both the weight and the operating time. The idea here is to turn the robot's skin, and the surface it moves on, into a wireless power line."
        - "In the snake robot, motor-driven joints travel along rack gears inside the body, so no wire can follow them. A soft robot skin powers those joints wirelessly instead, giving a 1.3 kg, 7.6 W robot that bends like a multi-joint snake with only a few joints (IEEE RA-L Best Paper Award)."
        - "The wall-running camera robot draws power while it drives over meander coils laid on the wall. It never has to stop or return to charge, so a small robot can keep watching a wide indoor area for long periods."
    zh:
      title: "无线化机器人・机器人皮肤"
      body: "让机器人摆脱布线与电池。把无线供电嵌入蛇形机器人的体内，以及在墙面行驶的摄像机器人的行驶面，使机器人不再受线缆缠绕与更换电池的束缚。"
      detail:
        - "束缚机器人运动的往往不是电机，而是布线与电池。跨越关节的线缆会在反复弯曲中缠绕、断线；电池则决定了机体重量与续航的上限。因此，我们把机器人的皮肤和行驶面本身变成无线电力线。"
        - "在蛇形机器人中，电机关节沿体内齿条移动，线缆无法随之布设。改由柔软的机器人皮肤向体内关节无线供电，实现了仅用少量关节即可像多关节一样弯曲的 1.3 kg、7.6 W 机体（IEEE RA-L Best Paper Award）。"
        - "在墙面行驶的摄像机器人，一边在铺设于墙面的蛇形线圈上行驶，一边接收电力。无需为充电而停下或返回，小型机体即可长期持续巡视室内的大范围区域。"
  - id: "digital-fabrication"
    image: "digital-fabrication.jpg"
    video_first: ["eBqJG65DhPQ"]     # 詳細ページ上部の動画で先頭に出すもの（YouTube の動画ID）。Cuttable WPT Sheet
    match: ["cuttable", "3d-printing", "plug-n-play", "prototyping", "pneumodule",
            "3d印刷", "水溶性", "切断"]
    ja:
      title: "IoT・HCI"
      body: "ハサミで切れるワイヤレス充電シートや、水溶性の流路に液体金属を流し込む 3D 印刷など、電子デバイスを誰でも作り変えられる製造手法を設計する。"
      detail:
        - "電子デバイスは一度作ると形を変えられない。センサの最適な位置は人によっても用途によっても違うのに、導電糸で縫い付けてしまうと後から動かせない。"
        - "そこで、作り変えられる作り方そのものを設計している。H 木配線のワイヤレス充電シートは、ハサミで切っても残った部分が動き続ける。水溶性樹脂で 3D 印刷した流路に液体金属を流し込めば、水に溶かして液体金属を回収でき、4回の作り直しでも 98% が戻る。機械編みで電力と通信のバスを布に織り込み、センサを磁石で付け替えられるようにすれば、位置合わせを何度でもやり直せる。"
    en:
      title: "IoT / HCI"
      body: "Wireless charging sheets that can be cut with scissors, and 3D-printed water-soluble channels filled with liquid metal — fabrication methods that let anyone reshape an electronic device."
      detail:
        - "Once an electronic device is built, its shape is fixed. The best sensor position differs from person to person and from task to task, yet conductive stitching bonds a sensor permanently in place."
        - "So the fabrication method itself is the research. A wireless charging sheet with H-tree wiring keeps working in whatever part remains after you cut it with scissors. Liquid metal poured into 3D-printed water-soluble channels can be recovered by dissolving the mould in water, with 98% recovered after four rebuild cycles. Machine knitting embeds power and communication buses into the fabric, and magnetically repositionable sensors let the layout be adjusted again and again."
    zh:
      title: "IoT・HCI"
      body: "可用剪刀裁剪的无线充电薄片，以及向水溶性流道注入液态金属的 3D 打印——设计让任何人都能重新塑造电子器件的制造方法。"
      detail:
        - "电子器件一旦制成，形状便固定下来。传感器的最佳位置因人、因用途而异，但用导电线缝合后就无法再移动。"
        - "因此，研究对象正是「可改造的制造方法」本身。采用 H 树布线的无线充电薄片，即使用剪刀裁剪，剩余部分仍能继续工作。将液态金属注入 3D 打印的水溶性流道，可通过溶解模具回收金属，四次重制后仍能回收 98%。机器编织把供电与通信总线织入布料，配合可磁性移位的传感器，布局便能反复调整。"
