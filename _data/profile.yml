# 研究テーマ（トップの Research セクション）
research:
  - id: "wpt-textile"
    image: "wpt-textile.jpg"
    # 関連論文の抽出キーワード（title + venue を小文字化して部分一致）。
    # ロボット関連は robot-power 側に寄せたいので exclude で外す。
    match: ["meander", "メアンダ", "wpt", "wireless power", "無線給電", "無線電力",
            "power transfer", "liquid metal", "液体金属", "給電", "電磁界", "電力伝送",
            "wireless charging", "wireless powering"]
    # センサ読み取りが主題のものは bodyscale-sensing に寄せる。
    # 部屋規模の中継器・空洞共振器・プラレールは「テキスタイル」ではないので外す。
    exclude: ["ロボット", "robot", "ヘビ型",
              "nfc", "センサ", "readout", "読み取り",
              "relay resonator", "空洞共振器", "プラレール"]
    ja:
      title: "無線給電テキスタイル"
      body: "人体に安全なメアンダコイルを衣服の全面に編み込み、身体のどこにいても W 級の電力を届ける。液体金属配線や機械編みによって、洗える・切れる・伸びる給電服を作る。"
    en:
      title: "Wireless power textiles"
      body: "Meander coils that are safe to the body are knitted across a whole garment, delivering watt-level power anywhere on it. Liquid-metal wiring and machine knitting make the fabric washable, cuttable and stretchable."
    zh:
      title: "无线供电纺织品"
      body: "将对人体安全的蜿蜒线圈编织于整件衣服，可在身体任意位置提供瓦级电力。借助液态金属布线与机器编织，实现可水洗、可裁剪、可拉伸的供电服装。"
  - id: "batteryfree-input"
    image: "batteryfree-input.jpg"
    # "ring" 単体は powering / networking などに部分一致してしまうので使わない。
    match: ["picoring", "telemetring", "指輪", "wristband", "リストバンド",
            "mouse", "マウス", "キーボード", "コントローラ", "thumb-to-index"]
    ja:
      title: "電池レスなウェアラブル入力"
      body: "指輪とリストバンドのコイル間の磁気結合を読み取ることで、電池も無線チップも積まない極低電力な指輪型入力デバイスを実現する。"
    en:
      title: "Battery-free wearable input"
      body: "By sensing the magnetic coupling between a ring coil and a wristband coil, ultra-low-power ring input devices work without a battery or a radio on the ring."
    zh:
      title: "无电池可穿戴输入"
      body: "通过读取戒指线圈与腕带线圈之间的磁耦合，实现戒指端无需电池与无线芯片的超低功耗输入设备。"
  - id: "bodyscale-sensing"
    image: "bodyscale-sensing.jpg"
    # 指輪側の NFC 論文と、ロボット系（"センサレス" が "センサ" に一致する）を外す。
    match: ["nfc", "e-knit", "eknit", "bodynet", "センサ", "センシング",
            "sensing", "sensor", "読み取り", "readout", "knittable",
            "電子ニット", "機械編み"]
    exclude: ["picoring", "wristband", "指輪", "mouse", "ロボット", "robot"]
    ja:
      title: "全身スケールの無線センシング"
      body: "メアンダ形状の電子ニットを一枚の服として編み、全身に散らばったバッテリレスセンサをまとめて読み取る近接無線ネットワークを組む。"
    en:
      title: "Body-scale wireless sensing"
      body: "A single machine-knitted meandered e-textile forms a near-field network that reads out battery-free sensors distributed over the entire body."
    zh:
      title: "全身尺度无线感知"
      body: "以机器编织的蜿蜒电子织物构成近场网络，统一读取分布于全身的无电池传感器。"
  - id: "robot-power"
    image: "robot-power.jpg"
    match: ["ロボット", "robot", "ヘビ型", "snake", "索状", "関節"]
    ja:
      title: "ロボットへの無線給電"
      body: "関節位置を移動できるヘビ型ロボットや小型移動ロボットに、床面や布から電力を届け続け、電池のいらない長期運用を可能にする。"
    en:
      title: "Wireless power for robots"
      body: "Floors and fabrics keep delivering power to joint-repositionable snake robots and small mobile robots, enabling long-term operation without batteries."
    zh:
      title: "机器人无线供电"
      body: "由地面或织物持续为可移动关节的蛇形机器人与小型移动机器人供电，实现无需电池的长期运行。"
