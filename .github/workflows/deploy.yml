name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      # ── ここから出力の検証（同じ内容を手元でも scripts/verify_site.sh で走らせられる） ──
      - name: Check all pages exist
        run: |
          set -e
          for p in index.html cv/index.html \
                   en/index.html en/cv/index.html \
                   zh/index.html zh/cv/index.html \
                   publications/index.html en/publications/index.html zh/publications/index.html \
                   research/e-textile/index.html research/low-power-wearable/index.html \
                   research/robot-skin/index.html research/digital-fabrication/index.html \
                   en/research/e-textile/index.html zh/research/e-textile/index.html \
                   sitemap.xml robots.txt 404.html; do
            test -s "_site/$p" || { echo "missing or empty: $p"; exit 1; }
          done

      - name: Check nav has exactly Publications and CV
        run: |
          set -e
          n=$(grep -o 'class="navbar"' -A0 _site/index.html | wc -l)
          grep -q '>論文</a>' _site/index.html
          grep -q '>CV</a>'   _site/index.html
          ! grep -q '>概要</a>' _site/index.html

      - name: Check each language renders its own text
        run: |
          set -e
          grep -q "電池も配線もいらない"        _site/index.html
          grep -q "no battery and no wire"      _site/en/index.html
          grep -q "无需电池与布线"              _site/zh/index.html
          grep -q "特任助教"                    _site/index.html
          grep -q "Project Assistant Professor" _site/en/index.html

      - name: Check hreflang and canonical
        run: |
          set -e
          grep -q 'hreflang="ja"' _site/index.html
          grep -q 'hreflang="en"' _site/index.html
          grep -q 'hreflang="zh"' _site/index.html
          grep -q 'rel="canonical"' _site/index.html

      - name: Check publication list rendered
        run: |
          set -e
          grep -q "Meander Coil++" _site/cv/index.html
          grep -q "picoRing"       _site/cv/index.html
          n=$(grep -oE 'class="entry[" ]' _site/cv/index.html | wc -l)
          echo "cv entries: $n"
          test "$n" -ge 133         # 学歴3+職歴8+研究費7+受賞19+論文86+講演10

      - name: Check CV page rendered
        run: |
          set -e
          grep -q 'id="pub-groups"' _site/cv/index.html
          grep -q "Best Paper Award" _site/en/cv/index.html
          grep -q "18,330,000" _site/cv/index.html        # 研究費の金額
          grep -q "Meta Inc" _site/cv/index.html          # 職歴
          grep -q "Principal Investigator" _site/cv/index.html

      - name: Check home shows 20 recent publications and links to CV
        run: |
          set -e
          n=$(grep -oE 'class="entry[" ]' _site/index.html | wc -l)
          echo "home entries: $n"     # 論文10 + 受賞6 + 講演5
          test "$n" -eq 21
          grep -q 'href="/cv/"' _site/index.html

      - name: Check filter tabs and author highlight
        run: |
          set -e
          grep -q 'data-filter="journal"'    _site/cv/index.html
          grep -q 'data-filter="conference"' _site/cv/index.html
          grep -q 'data-filter="media"'      _site/cv/index.html
          # 種別ごとの見出しが出ていること（年ごとの見出しではない）
          g=$(grep -o 'class="group-head"' _site/cv/index.html | wc -l)
          echo "group heads: $g"
          test "$g" -eq 8
          grep -q "class='me'"               _site/cv/index.html

      - name: Check no unrendered Liquid remains
        run: |
          set -e
          if grep -rlE '\{\{|\{%' _site --include='*.html' | grep -v 404; then
            echo "Liquid が残っている"; exit 1
          fi

      - name: Check private source file is absent
        run: |
          set -e
          ! find . -name '*.xlsx' | grep -q . || { echo "xlsx がリポジトリに含まれている"; exit 1; }
          ! test -d data_local

      # ── ここから配信 ──
      # Pages が未設定のうちは失敗するが、ビルドと検証の結果は上で確認できる。
      # 有効化: Settings → Pages → Source を «GitHub Actions» にする。
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages が未設定のうちは配信をスキップして案内だけ出す（ワークフローは緑のまま）
      - name: Check whether Pages is enabled
        id: check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 -H "Authorization: Bearer ${{ github.token }}" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages が未設定です。Settings → Pages → Build and deployment → Source を «GitHub Actions» にすると、次回の push から自動で公開されます。"
          fi
      - id: deployment
        if: steps.check.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
