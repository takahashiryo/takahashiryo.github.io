# CV の PDF を作ってリポジトリにコミットする。
#
# なぜコミットするのか:
#   このサイトは GitHub Pages と Cloudflare Pages の2か所から配信されていて、
#   Cloudflare は Actions の成果物ではなく自前で jekyll build している。
#   そのため Actions の中だけで PDF を作っても ryotakahashi.me には乗らない。
#   直下に置いてコミットしておけば、どちらの build でも _site に写される。
#
# SOURCE_DATE_EPOCH を固定しているのは、weasyprint が PDF に作成日時を
# 埋めるため。固定しないと中身が同じでも毎回バイト列が変わり、
# 実行のたびにコミットが増えてしまう。
name: Build CV PDF

on:
  push:
    branches: [main]
    paths:
      - "_data/**"
      - "_includes/page_cv_print.html"
      - "_includes/pub_row_print.html"
      - "_includes/term.html"
      - "_layouts/print.html"
      - "_pages/ja-cv-print.html"
      - "_pages/en-cv-print.html"
      - "scripts/make_cv_pdf.py"
      - ".github/workflows/cv-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Render PDF
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
          pip install --quiet weasyprint
          python3 scripts/make_cv_pdf.py
          test -s cv.pdf
          test -s cv-ja.pdf

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain cv.pdf cv-ja.pdf)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add cv.pdf cv-ja.pdf
            git commit -m "chore: CV の PDF を更新 [skip ci]"
            # 直後に別の push が入ると main が進んで push が弾かれる。
            # 取り込み直して再試行し、それでも駄目なら新しい push 側の実行に任せて成功扱いにする
            # （PDF は毎回作り直されるので、取りこぼしても次の実行で最新になる）。
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "::notice::main が先に進んだため PDF の push を見送った（後続の実行が更新する）"
            fi
          else
            echo "変更なし"
          fi
